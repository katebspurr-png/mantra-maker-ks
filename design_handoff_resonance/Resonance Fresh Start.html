   ══════════════════════════════════════════ */

/* ══════════════════════════════════════════

            background:"none", cursor:"pointer", display:"flex", alignItems:"center", justifyContent:"center",
            flexShrink:0 }}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill={B.text}><path d="M8 5.14v13.72a1 1 0 001.5.86l11-6.86a1 1 0 000-1.72l-11-6.86a1 1 0 00-1.5.86z"/></svg>
          </button>
          <div>
            <div style={{ fontSize:14, color:B.text, fontWeight:500 }}>I am a highly sought-after pr...</div>
            <div style={{ fontSize:12, color:B.textMuted, marginTop:1 }}>1:14 · 12 listens</div>
          </div>
        </div>
      </div>

      {/* Breathing divider */}
      <div style={{ margin:"44px 28px", height:1, background:`linear-gradient(90deg, transparent, ${B.border}, transparent)` }}></div>

      {/* Record CTA — understated but clear */}
      <div style={{ padding:"0 28px" }}>
        <div style={{ fontSize:11, letterSpacing:"0.1em", textTransform:"uppercase",
          color:B.textMuted, fontWeight:600, marginBottom:18 }}>Or speak something new</div>
        <button style={{ width:"100%", height:56, borderRadius:16,
          background:"none", border:`1.5px solid ${B.border}`,
          color:B.textSoft, fontSize:15, fontFamily:B.sans, fontWeight:500,
          display:"flex", alignItems:"center", justifyContent:"center", gap:9, cursor:"pointer",
          letterSpacing:"-0.01em" }}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={B.textSoft} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="22"/>
          </svg>
          Record a New Affirmation
        </button>
      </div>

      {/* Today suggestion — warm block */}
      <div style={{ margin:"28px 0 0", background:B.bgWarm, padding:"28px 28px" }}>
        <div style={{ fontSize:11, letterSpacing:"0.1em", textTransform:"uppercase",
          color:B.warm, fontWeight:600, marginBottom:16, opacity:0.9 }}>Try today</div>
        <div style={{ fontSize:26, fontFamily:B.serif, fontWeight:300, fontStyle:"italic",
          color:B.text, lineHeight:1.6 }}>
          "I am worthy of success and I embrace challenges as opportunities."
        </div>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:20 }}>
          <span style={{ fontSize:12, color:B.warm, fontWeight:500 }}>Confidence</span>
          <button style={{ height:34, padding:"0 18px", borderRadius:20,
            background:"none", border:`1px solid ${B.warm}50`,
            color:B.warm, fontSize:13, fontWeight:500, fontFamily:B.sans,
            display:"flex", alignItems:"center", gap:6, cursor:"pointer" }}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke={B.warm} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/>
              <path d="M19 10v2a7 7 0 01-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="22"/>
            </svg>
            Record
          </button>
        </div>
      </div>

      {/* Nav — minimal, no labels for 4 items */}
      <div style={{ position:"absolute", bottom:0, left:0, right:0, height:80,
        background:`${B.bg}f0`, backdropFilter:"blur(16px)", borderTop:`1px solid ${B.border}`,
        display:"flex", alignItems:"center", justifyContent:"space-around" }}>
        {[
          { label:"Home", active:true, d:"M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z" },
          { label:"Library", d:"M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" },
          { label:"Record", isCTA:true },
          { label:"Playlists", d:"M8 6h13 M8 12h13 M8 18h13" },
          { label:"You", d:"M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2 M12 3a4 4 0 100 8 4 4 0 000-8z" },
        ].map((item,i) => {
          if (item.isCTA) return (
            <div key="cta" style={{ display:"flex", flexDirection:"column", alignItems:"center" }}>
              <div style={{ width:46, height:46, borderRadius:14, marginTop:-14,
                background:B.text, display:"flex", alignItems:"center", justifyContent:"center",
                boxShadow:`0 4px 14px rgba(28,26,22,0.2)` }}>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/>
                  <path d="M19 10v2a7 7 0 01-14 0v-2"/>
                  <line x1="12" y1="19" x2="12" y2="22"/>
                </svg>
              </div>
              <span style={{ fontSize:9, color:B.textMuted, marginTop:4, fontFamily:B.sans }}>Record</span>
            </div>
          );
          return (
            <button key={i} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center",
              gap:4, background:"none", border:"none", cursor:"pointer" }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke={item.active?B.accent:B.textMuted} strokeWidth={item.active?"2":"1.5"}
                strokeLinecap="round" strokeLinejoin="round">
                {item.d && item.d.split(" M").map((d,di)=><path key={di} d={di===0?d:"M"+d}/>)}
              </svg>
              <span style={{ fontSize:9, color:item.active?B.accent:B.textMuted, fontFamily:B.sans,
                fontWeight:item.active?600:400 }}>{item.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
};
